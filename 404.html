<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Page not found - The Mock Sports</title>
  <link rel="icon" type="image/x-icon" href="/icon.png">
  <link rel="apple-touch-icon" href="/icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #111827;
      --bg-rail: #1f2937;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #e0b93c;
      --radius: 999px;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background: var(--bg);
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header { padding: 28px clamp(20px, 5vw, 64px); }
    .brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); }
    .brand img { width: 36px; height: 36px; border-radius: 10px; display: block; }
    .brand span { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 1rem; letter-spacing: .01em; }

    main {
      align-self: center;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px clamp(20px, 5vw, 64px) 56px;
    }

    .code {
      position: relative;
      display: inline-block;
      margin: 0 0 8px;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: clamp(120px, 28vw, 300px);
      line-height: .9;
      letter-spacing: -0.05em;
      color: var(--accent);
    }
    /* the strike-through of a scratched runner on a race card */
    .code::after {
      content: "";
      position: absolute;
      left: -2%; right: -2%; top: 52%;
      height: clamp(6px, 1.4vw, 14px);
      background: var(--text);
      border-radius: 2px;
      transform-origin: left center;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: clamp(1.75rem, 4.2vw, 2.75rem);
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin: 0 0 14px;
    }
    .lede {
      max-width: 44ch;
      margin: 0 0 36px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      white-space: nowrap;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      color: #111827;
      background: var(--accent);
      padding: 14px 32px;
      border-radius: var(--radius);
      transition: transform .25s var(--ease), background .2s ease;
    }
    .btn:hover { background: #ecc956; transform: translateY(-2px); }
    .btn:active { transform: translateY(0) scale(.98); }
    .btn:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

    /* starting-gate rail */
    .rail {
      height: 14px;
      background: repeating-linear-gradient(90deg, var(--accent) 0 28px, var(--bg-rail) 28px 56px);
      opacity: .9;
    }

    @media (prefers-reduced-motion: no-preference) {
      .code, h1, .lede, .btn { animation: rise .8s var(--ease) both; }
      h1 { animation-delay: .15s; }
      .lede { animation-delay: .25s; }
      .btn { animation-delay: .35s; }
      .code::after { animation: strike .7s var(--ease) .6s both; }
      @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
      @keyframes strike { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/index.html">
      <img src="/icon.png" alt="">
      <span>The Mock Sports</span>
    </a>
  </header>

  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>This one's been scratched.</h1>
    <p class="lede">The page you're after isn't in the field today. It may have moved, or the link is wrong.</p>
    <a class="btn" href="/index.html">Back to home</a>
  </main>

  <div class="rail" aria-hidden="true"></div>
</body>
</html>
